# ClipRelay Docker Compose
#
# 使用：
#   cd deploy/docker && docker compose up -d

services:
  clip-relay:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      # N1 等 OpenWRT 设备：DNS 代理可能拦截容器 DNS，需要 host 网络模式构建
      # 如果遇到 npm ERR! EAI_AGAIN，取消下面这行的注释：
      # network: host
    ports:
      - "3000:3000"
    volumes:
      - clip-relay-data:/app/data
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production

volumes:
  clip-relay-data:
